name: AspectJ Reproducibility Build

# Manual only. Builds the jars and attaches them to the run; nothing is published.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and attach artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build (no tests, no deploy)
        run: ./mvnw -B -ntp clean package -DskipTests
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: jars
          path: |
            **/target/*.jar
            **/target/*.pom
          if-no-files-found: error
          retention-days: 7
